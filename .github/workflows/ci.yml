name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: python3 tools/secret_scan.py
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: python3 -m compileall -q legacy
      - name: Evaluation (smoke on synthetic data + any configured suites)
        run: uv run python -m eval_harness run --suite all --report eval/out/EVAL_REPORT.md
      - name: Regression gate against stored baseline
        run: uv run python -m eval_harness gate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: uv sync --all-packages
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
