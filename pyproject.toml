[project]
name = "interview-coach-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["interview-core"]

[tool.uv.sources]
interview-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "opencv-python-headless>=4.9", "httpx2"]

[tool.uv.workspace]
members = ["packages/core", "services/api", "eval"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B011"]
"services/api/migrations/**" = ["W291", "E501", "UP"]
"eval/benchmarks/**" = ["E401", "E402", "E701", "E702", "E501", "SIM115", "S", "B"]  # one-off research scripts

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages/core/tests", "services/api/tests", "eval/tests"]
