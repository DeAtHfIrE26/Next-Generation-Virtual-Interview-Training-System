[project]
name = "interview-api"
version = "0.1.0"
description = "HTTP API for the AI Interview Coach."
requires-python = ">=3.11"
dependencies = [
    "interview-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "pillow>=10.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
gcp = ["google-cloud-kms>=3.0"]
llm = ["anthropic>=1.11"]
observability = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25",
                 "opentelemetry-instrumentation-fastapi>=0.46b0", "sentry-sdk[fastapi]>=2.0"]

[tool.uv.sources]
interview-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_api"]
